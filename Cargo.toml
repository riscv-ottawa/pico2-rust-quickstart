[package]
edition = "2024"
name = "pico2-rust-quickstart"
rust-version = "1.88"
version = "0.1.0"

[dependencies]
rp235x-hal = { version = "0.4.0", features = [
    "binary-info",
    "critical-section-impl",
    "rt",
] }

embassy-executor = { version = "0.10.0", features = [
    "executor-thread",
    "platform-riscv32",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.0", features = ["tick-hz-1_000_000"] }
embassy-time-driver = "0.2.1"
embassy-time-queue-utils = "0.3.0"
rtt-target = "0.6.2"

critical-section = "1.2.0"
embedded-hal = "1.0.0"
heapless = "0.9.3"
log = "0.4.29"
static_cell = "2.1.1"
usb-device = "0.3.2"
usbd-serial = "0.2.2"

# The Pico 2 W's radio.
cyw43 = { version = "0.7.0", features = ["log"] }
pio = "0.3.0"

[lints.clippy]
mem_forget = "deny"

# For fine tuning these settings, see: https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2         # prefer slower builds but better debugging experience
lto = 'fat'
opt-level = 's'
